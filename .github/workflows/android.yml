
name: Build SHAHINAZ APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Found sdkmanager: $SDKMANAGER"
          SDK_DIR=$(dirname "$SDKMANAGER")
          echo "$SDK_DIR" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7

          mkdir www
          cp index.html www/index.html

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.shahinaz.app",
            "appName": "SHAHINAZ",
            "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHAHINAZ-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
